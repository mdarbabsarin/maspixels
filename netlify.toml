[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/poses-*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/logos-*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/brand-*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/media-*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
